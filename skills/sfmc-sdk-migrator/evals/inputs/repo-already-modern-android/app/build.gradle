plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.newsapp'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.newsapp"
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName "2.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'

    // Already on the UNIFIED SDK. sfmcsdk is the core (its own 3.x stream);
    // marketingcloudsdk 11.0.1 is the ENGAGEMENT feature module (umbrella
    // version). This project is fully migrated — the skill should NOT rewrite it.
    implementation 'com.salesforce.marketingcloud:sfmcsdk:3.1.1'
    implementation 'com.salesforce.marketingcloud:marketingcloudsdk:11.0.1'
    implementation 'com.salesforce.marketingcloud:pushfeaturemodule:2.0.1'
}
