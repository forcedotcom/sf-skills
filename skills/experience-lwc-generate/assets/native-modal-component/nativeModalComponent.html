<template>
    <lightning-modal-header label={label}></lightning-modal-header>

    <lightning-modal-body>
        <p>{content}</p>
        <slot></slot>
    </lightning-modal-body>

    <lightning-modal-footer>
        <lightning-button
            label="Cancel"
            onclick={handleCancel}
            class="slds-m-right_x-small">
        </lightning-button>
        <lightning-button
            variant="brand"
            label="Save"
            onclick={handleSave}>
        </lightning-button>
    </lightning-modal-footer>
</template>
