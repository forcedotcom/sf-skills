steps:
- id: resolve-package-on-packaging-org
  description: Resolve the source package name or ID on its original packaging org.
    Skip the name query when the user already supplied a validated 033 ID.
  api_type: tooling_api
  operation: queryMetadataPackageByName
  purpose: read
  status: implemented
  invocation:
    kind: rest
    method: GET
    path: /services/data/v69.0/tooling/query
    target_org: '{packaging_org_alias}'
    query_params:
      q: SELECT Id, Name, NamespacePrefix FROM MetadataPackage WHERE Name = '{package_name}'
  inputs:
  - &id001
    name: packaging_org_alias
    type: String
    source: user_input
    description: Authenticated original 1GP packaging org; do not use the Dev Hub
      or a subscriber org.
  - name: package_name
    type: String
    source: user_input
    description: The source package name supplied by the user. Escape it as a SOQL
      string literal before interpolating.
  output:
    subscriber_package_id: $.records[0].Id
    package_name: $.records[0].Name
  agent_guidance: 'Zero matches: stop and check the package name and packaging org.
    Multiple matches: ask the user to select by ID or namespace, never select records[0]
    automatically. Confirm the chosen org and package before continuing.'
- id: check-already-done
  description: Check the packaging org conversion record before requesting any finalization.
    EndDate populated means already complete; no record means not converted.
  api_type: tooling_api
  operation: queryPackageConversion
  purpose: validate
  status: implemented
  invocation:
    kind: rest
    method: GET
    path: /services/data/v69.0/tooling/query
    target_org: '{packaging_org_alias}'
    query_params:
      q: SELECT Id, EndDate, FinalizedVersionId, FinalizedVersionNumber FROM PackageConversion
        WHERE ConvertedFromPackageId = '{subscriber_package_id}'
  inputs:
  - *id001
  - &id002
    name: subscriber_package_id
    type: String
    source: user_input
    description: The selected 1GP package ID (033 prefix), resolved on the packaging
      org or supplied by the user.
  depends_on: []
  output:
    conversion_count: $.totalSize
    end_date: $.records[0].EndDate
  agent_guidance: 'Do not inspect records[0] when totalSize is zero. If no record
    exists, stop: initial package conversion is required. If EndDate is non-null,
    report already finalized and stop without confirmations or POST. If the query
    fails, report that status could not be checked; do not interpret an API error
    as zero records. Native Package2Version existence is not the completion check.'
- id: check-eligibility-1gp-released
  description: Select the highest Released 1GP major.minor.patch version and reject
    a nonzero patch before finalization.
  api_type: tooling_api
  operation: queryHighestReleased1GPVersion
  purpose: validate
  status: implemented
  invocation:
    kind: rest
    method: GET
    path: /services/data/v69.0/tooling/query
    target_org: '{packaging_org_alias}'
    query_params:
      q: SELECT Id, MajorVersion, MinorVersion, PatchVersion, ReleaseState FROM MetadataPackageVersion
        WHERE MetadataPackageId = '{subscriber_package_id}' AND ReleaseState = 'Released'
        ORDER BY MajorVersion DESC, MinorVersion DESC, PatchVersion DESC LIMIT 1
  inputs:
  - *id001
  - *id002
  depends_on:
  - check-already-done
  output:
    highest_1gp_version_id: $.records[0].Id
    highest_1gp_major: $.records[0].MajorVersion
    highest_1gp_minor: $.records[0].MinorVersion
    highest_1gp_patch: $.records[0].PatchVersion
  agent_guidance: 'No rows: stop because a Released 1GP version is required. PatchVersion
    nonzero: stop because the latest Released 1GP version is a patch and cannot be
    finalized. Otherwise retain all three version coordinates. Use the optional Dev
    Hub pre-check if available; otherwise go to confirm-affirmations, letting the
    server validate the converted version.'
- id: discover-package-on-devhub
  description: 'Optional: look up the converted Package2 on the connected Dev Hub.
    Skip this operation entirely when no Dev Hub is available.'
  api_type: tooling_api
  operation: queryPackage2ByConvertedFrom
  purpose: read
  status: implemented
  invocation:
    kind: rest
    method: GET
    path: /services/data/v69.0/tooling/query
    target_org: '{devhub_alias}'
    query_params:
      q: "SELECT Id, Name, NamespacePrefix, ConvertedFromPackageId,\n  ContainerOptions\
        \ FROM Package2 WHERE\n  ConvertedFromPackageId = '{subscriber_package_id}'"
  inputs:
  - name: devhub_alias
    type: String
    source: user_input
    description: The optional authenticated Dev Hub.
  - name: subscriber_package_id
    type: String
    source: user_input
    description: The selected 1GP package ID (033 prefix), resolved on the packaging
      org or supplied by the user.
  output:
    package2_id: $.records[0].Id
    package_name: $.records[0].Name
    namespace_prefix: $.records[0].NamespacePrefix
    subscriber_package_id: $.records[0].ConvertedFromPackageId
    container_options: $.records[0].ContainerOptions
  agent_guidance: 'Only run when a Dev Hub connection is available. Keep the package
    ID resolved from the packaging org. No matches: stop the proactive check and ask
    the user to verify the Dev Hub and package conversion. Do not treat missing records
    on one Dev Hub as proof that no conversion exists anywhere. See https://developer.salesforce.com/docs/platform/pkg1-dev/guide/migration-move-to-2gp-workflow.html
    for preparation.'
  depends_on:
  - check-eligibility-1gp-released
- id: check-eligibility-2gp-converted-released
  description: 'Optional: select the highest Released converted 2GP version and require
    an exact major.minor.patch match with the highest Released 1GP version.'
  api_type: tooling_api
  operation: queryReleased2GPConvertedVersion
  purpose: validate
  status: implemented
  invocation:
    kind: rest
    method: GET
    path: /services/data/v69.0/tooling/query
    target_org: '{devhub_alias}'
    query_params:
      q: SELECT Id, MajorVersion, MinorVersion, PatchVersion, IsReleased, ConvertedFromVersionId,
        SubscriberPackageVersionId FROM Package2Version WHERE Package2Id = '{package2_id}'
        AND IsReleased = true AND ConvertedFromVersionId != NULL ORDER BY MajorVersion
        DESC, MinorVersion DESC, PatchVersion DESC LIMIT 1
  inputs:
  - name: devhub_alias
    type: String
    source: user_input
    description: Authenticated Dev Hub, available only on the optional Dev Hub branch.
  - name: package2_id
    type: String
    source: prior_step
    description: Converted package ID from discover-package-on-devhub.
  depends_on:
  - discover-package-on-devhub
  output:
    converted_2gp_version_id: $.records[0].Id
    converted_2gp_major: $.records[0].MajorVersion
    converted_2gp_minor: $.records[0].MinorVersion
    converted_2gp_patch: $.records[0].PatchVersion
    converted_subscriber_version_id: $.records[0].SubscriberPackageVersionId
  agent_guidance: 'Skip when Dev Hub is unavailable. No Released converted version:
    stop and explain that the latest converted version must be Released. Otherwise
    compare MajorVersion, MinorVersion, and PatchVersion with check-eligibility-1gp-released.
    Any mismatch blocks finalization. Do not select an older matching version to bypass
    a newer Released version. Initial conversion and package promotion are separate
    workflows.'
- id: confirm-affirmations
  description: 'Collect three independent user acknowledgements: irreversibility,
    completion of both testing activities, and retrieved and preserved source.'
  api_type: composite
  purpose: validate
  status: implemented
  invocation:
    kind: agent_prompt
    affirmations:
    - id: acknowledged_irrevocable
      prompt: Confirm you understand this is a one-way transition and no new major/minor
        1GP versions of this package can be created after finalization. Older 1GP
        versions remain patchable; patches for the moved version and later versions
        use 2GP.
    - id: acknowledged_testing_complete
      prompt: Confirm both package-conversion testing and subscriber-migration testing
        are complete.
    - id: acknowledged_source_retrieved
      prompt: Confirm the latest converted package source has been retrieved and preserved,
        and sfdx-project.json has been prepared for ongoing 2GP development.
  inputs:
  - *id002
  depends_on:
  - check-eligibility-1gp-released
  output:
    acknowledged_irrevocable: $.affirmations.acknowledged_irrevocable
    acknowledged_testing_complete: $.affirmations.acknowledged_testing_complete
    acknowledged_source_retrieved: $.affirmations.acknowledged_source_retrieved
  agent_guidance: Present all three confirmations and require a distinct explicit
    affirmative answer for each. Do not assume a general request to migrate attests
    to testing or source retrieval. If any answer is negative or missing, stop. On
    the Dev Hub branch, also require the converted-version pre-check to have passed
    before asking. These are the three API acknowledgements, not a claim that the
    Setup dialog has exactly three checkboxes.
- id: finalize-move-to-2gp
  description: Finalize the selected package on its original packaging org using API
    69.0 after all three acknowledgements and applicable pre-checks.
  api_type: connect_api
  operation: finalizeMoveTo2gp
  purpose: write
  status: implemented
  invocation:
    kind: rest
    method: POST
    path: /services/data/v69.0/connect/packaging/package/{subscriber_package_id}/finalize-move-to-2gp
    target_org: '{packaging_org_alias}'
    body:
      acknowledgedIrrevocable: '{acknowledged_irrevocable}'
      acknowledgedTestingComplete: '{acknowledged_testing_complete}'
      acknowledgedSourceRetrieved: '{acknowledged_source_retrieved}'
    fallback:
      kind: manual
      when: The finalization endpoint is unavailable on the org supported API versions,
        not when an access or business-rule check fails.
      description: After all three confirmations, direct the user to Setup > Package
        Manager > the selected package > Move to 2GP. Ask them to review every statement
        in the dialog and click Proceed. Then verify state.
  inputs:
  - name: packaging_org_alias
    type: String
    source: prior_step
    description: Authenticated original 1GP packaging org; do not use the Dev Hub
      or a subscriber org.
  - name: subscriber_package_id
    type: String
    source: prior_step
    description: The selected 1GP package ID (033 prefix), resolved on the packaging
      org or supplied by the user.
  - name: acknowledged_irrevocable
    type: Boolean
    source: prior_step
    description: The explicit user confirmation from confirm-affirmations; never infer
      or hard-code this value.
  - name: acknowledged_testing_complete
    type: Boolean
    source: prior_step
    description: The explicit user confirmation from confirm-affirmations; never infer
      or hard-code this value.
  - name: acknowledged_source_retrieved
    type: Boolean
    source: prior_step
    description: The explicit user confirmation from confirm-affirmations; never infer
      or hard-code this value.
  depends_on:
  - confirm-affirmations
  output:
    successfully_finalized: $.successfullyFinalized
    finalized_at: $.finalizedAt
    finalized_package_id: $.packageId
    conversion_id: $.conversionId
  verify_pattern: chained
  agent_guidance: 'All three request booleans must be bound to their explicit user
    confirmations. HTTP 200 with successfullyFinalized=true means the call succeeded;
    verify EndDate directly next. finalizedAt and conversionId may be null. A business-rule
    400 stops the workflow: explain the returned message (version mismatch, patch
    version, pending patch org, or missing acknowledgements). Already-finalized messages
    trigger a state read and early exit, not another POST. A 403 can mean missing
    CreatePackaging/edit rights, an invalid package ID, or a temporarily disabled
    feature; surface the service explanation. An editable package with no conversion
    record returns 404: initial conversion is needed, not a browser fallback. On a
    timeout or uncertain outcome, read EndDate before considering any repeat write.
    Never retry automatically or fall back to Setup to bypass a rejection. See references/api-operations.md
    for request and error handling.'
- id: verify-finalize-on-packaging-org
  description: Read the selected conversion record on the same packaging org and confirm
    EndDate is populated.
  api_type: tooling_api
  operation: queryPackageConversion
  purpose: verify
  status: implemented
  invocation:
    kind: rest
    method: GET
    path: /services/data/v69.0/tooling/query
    target_org: '{packaging_org_alias}'
    query_params:
      q: "SELECT Id, EndDate, FinalizedVersionId, FinalizedVersionNumber\n  FROM PackageConversion\
        \ WHERE\n  ConvertedFromPackageId = '{subscriber_package_id}'"
  inputs:
  - *id001
  - *id002
  depends_on:
  - finalize-move-to-2gp
  output:
    end_date: $.records[0].EndDate
    finalized_version_number: $.records[0].FinalizedVersionNumber
  assertion: response.records[0].EndDate != null
  agent_guidance: Run directly after API success; no browser/user-report step is required.
    EndDate non-null confirms persisted completion. If null, retry the read once after
    30 seconds and then report the unresolved discrepancy without repeating POST.
    If verification is inaccessible, report API success separately from unverified
    persisted state. API finalizedAt and conversionId can be null. A native 2GP version
    is created separately and must not be used as a success requirement.
- id: verify-finalize-by-user-confirmation
  description: 'Manual Setup fallback only: ask the user for the outcome after Proceed
    and verify PackageConversion where the org supports it.'
  api_type: composite
  purpose: verify
  status: implemented
  invocation:
    kind: agent_prompt
    verification_prompts:
    - id: page_outcome
      prompt: '"What did the Setup page show after you clicked Proceed in the Move
        to Second-Generation Managed Packaging dialog? Specifically: did you see a
        success confirmation, an error message, or something else? If you saw an error,
        please paste it verbatim."'
    - id: page_state_post_click
      prompt: '"Is the Move to 2GP button still visible on the package detail page,
        or has the page state changed (e.g. the button is now greyed out, or replaced
        with a ''this package is in 2GP development'' indicator)?"'
  inputs:
  - *id002
  depends_on:
  - finalize-move-to-2gp
  output:
    page_outcome_text: $.verification_prompts.page_outcome
    page_state_text: $.verification_prompts.page_state_post_click
  agent_guidance: Skip this step for direct API finalization. On the manual branch,
    capture any error and stop on rejection. A verbal success report is a user report,
    not an independent state check; read PackageConversion.EndDate where available.
    If state cannot be read, clearly report the verification limit. Do not repeatedly
    request finalization when its result is unknown.
metadata: *id003
reference_artifacts:
- path: references/api-operations.md
  description: Public REST and Tooling contracts, CLI examples, and response handling.
runtime_gating:
  accessCheck: UserPermissions.CreatePackaging
