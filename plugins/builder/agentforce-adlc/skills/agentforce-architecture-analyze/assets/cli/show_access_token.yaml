name: show_access_token
# Access-token retrieval per forcedotcom/cli#3560. The `sf org display --json`
# accessToken field is redacted to a placeholder string; the dedicated
# `sf org auth show-access-token` command is the replacement.
#
# `--no-prompt` skips the interactive confirmation banner so the command
# behaves identically under `--json`.
#
# This command is the only supported runtime token-retrieval path.
argv:
  - sf
  - org
  - auth
  - show-access-token
  - --target-org
  - "{{ORG_ALIAS}}"
  - --json
  - --no-prompt
timeout_seconds: 60
required_params: [ORG_ALIAS]
success_check: stdout_json_status_zero
auth_required_stderr_patterns:
  - NoOrgAuthenticationError
  - AuthInfoError
